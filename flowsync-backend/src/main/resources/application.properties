# =============================================
#   FlowSync — Application Configuration
# =============================================

# Server
server.port=8080

# =============================================
# Database — Update credentials to match yours
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flowsync_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
# Change this secret to a long random string in production
flowsync.jwt.secret=FlowSyncSuperSecretKeyForJWTTokenGenerationMustBe256BitsLong2024
flowsync.jwt.expiration=86400000

# =============================================
# Logging
# =============================================
logging.level.com.flowsync=DEBUG
logging.level.org.springframework.security=INFO

# =============================================
# Jackson (dates as ISO-8601 strings)
# =============================================
spring.jackson.serialization.write-dates-as-timestamps=false
