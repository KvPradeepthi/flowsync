# =============================================
#   FlowSync — Application Configuration
# =============================================

# Server
server.port=${PORT:8080}

# =============================================
# Database Configuration (PostgreSQL on Render / MySQL on Docker)
# =============================================
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/flowsync_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
# Change this secret to a long random string in production
flowsync.jwt.secret=FlowSyncSuperSecretKeyForJWTTokenGenerationMustBe256BitsLong2024
flowsync.jwt.expiration=86400000

# =============================================
# Logging
# =============================================
logging.level.com.flowsync=DEBUG
logging.level.org.springframework.security=INFO

# =============================================
# Jackson (dates as ISO-8601 strings)
# =============================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================
# Mail / SMTP Configuration (Gmail, Brevo, SendGrid, etc.)
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:deepthikamichetty336@gmail.com}
spring.mail.password=${MAIL_PASSWORD:bsibarrxgirzxrua}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

